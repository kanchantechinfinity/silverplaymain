<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#f8f0da"/>
      <stop offset="55%" stop-color="#f2e8d0"/>
      <stop offset="100%" stop-color="#e6d3a8"/>
    </radialGradient>
    <g id="petalRing">
      <g stroke="#8a6a2e" stroke-width="1.4" fill="none" opacity="0.55">
        <circle r="60"/><circle r="90"/><circle r="120"/>
      </g>
    </g>
    <g id="mandalaMotif">
      <!-- radiating dotted lines -->
      <g stroke="#8a6a2e" stroke-width="1.1" opacity="0.5">
        <line x1="0" y1="0" x2="200" y2="0" stroke-dasharray="1 7"/>
      </g>
      <!-- concentric arcs -->
      <g fill="none" stroke="#8a6a2e" opacity="0.6">
        <circle r="40" stroke-width="1.2"/>
        <circle r="70" stroke-width="1"/>
        <circle r="100" stroke-width="1.4"/>
        <circle r="130" stroke-width="0.9"/>
        <circle r="160" stroke-width="1.1"/>
      </g>
      <!-- petal florets around ring -->
      <g fill="#8a6a2e" opacity="0.65">
        <g id="florets"></g>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="#8a6a2e" opacity="0.03"/>

  <!-- top-left corner motif -->
  <g transform="translate(0,0)">
    <g transform="translate(0,0) scale(1.6)">
      <use href="#mandalaMotif" x="0" y="0"/>
      <g stroke="#8a6a2e" fill="none" opacity="0.55">
        <path d="M0,20 Q40,20 40,60 Q40,100 80,100" stroke-width="1.2"/>
        <path d="M0,45 Q65,45 65,110 Q65,175 130,175" stroke-width="1"/>
        <path d="M0,70 Q95,70 95,165 Q95,260 190,260" stroke-width="0.9"/>
      </g>
      <g fill="#8a6a2e" opacity="0.7">
        <circle cx="0" cy="20" r="3"/><circle cx="0" cy="45" r="3"/><circle cx="0" cy="70" r="3"/>
        <circle cx="40" cy="60" r="3"/><circle cx="65" cy="110" r="3"/><circle cx="95" cy="165" r="3"/>
        <circle cx="80" cy="100" r="4"/><circle cx="130" cy="175" r="4"/><circle cx="190" cy="260" r="4"/>
      </g>
      <!-- lotus burst at the corner apex -->
      <g transform="translate(0,0)">
        <g fill="none" stroke="#8a6a2e" stroke-width="1.1" opacity="0.6">
          <circle r="18"/><circle r="30"/><circle r="42"/>
        </g>
        <g stroke="#8a6a2e" stroke-width="1" opacity="0.5">
          <path d="M0,0 L0,54" stroke-dasharray="1 6"/>
          <path d="M0,0 L38,38" stroke-dasharray="1 6"/>
          <path d="M0,0 L54,0" stroke-dasharray="1 6"/>
        </g>
      </g>
    </g>
  </g>

  <!-- bottom-right corner motif (mirrored) -->
  <g transform="translate(1600,900) scale(-1,-1)">
    <g transform="scale(1.6)">
      <g stroke="#8a6a2e" fill="none" opacity="0.55">
        <path d="M0,20 Q40,20 40,60 Q40,100 80,100" stroke-width="1.2"/>
        <path d="M0,45 Q65,45 65,110 Q65,175 130,175" stroke-width="1"/>
        <path d="M0,70 Q95,70 95,165 Q95,260 190,260" stroke-width="0.9"/>
        <path d="M0,95 Q130,95 130,225 Q130,355 260,355" stroke-width="1.2"/>
      </g>
      <g fill="#8a6a2e" opacity="0.7">
        <circle cx="0" cy="20" r="3"/><circle cx="0" cy="45" r="3"/><circle cx="0" cy="70" r="3"/><circle cx="0" cy="95" r="3"/>
        <circle cx="40" cy="60" r="3"/><circle cx="65" cy="110" r="3"/><circle cx="95" cy="165" r="3"/><circle cx="130" cy="225" r="3"/>
        <circle cx="80" cy="100" r="4"/><circle cx="130" cy="175" r="4"/><circle cx="190" cy="260" r="4"/><circle cx="260" cy="355" r="4"/>
      </g>
      <g transform="translate(0,0)">
        <g fill="none" stroke="#8a6a2e" stroke-width="1.1" opacity="0.6">
          <circle r="18"/><circle r="30"/><circle r="42"/><circle r="54"/>
        </g>
        <g stroke="#8a6a2e" stroke-width="1" opacity="0.5">
          <path d="M0,0 L0,66" stroke-dasharray="1 6"/>
          <path d="M0,0 L46,46" stroke-dasharray="1 6"/>
          <path d="M0,0 L66,0" stroke-dasharray="1 6"/>
        </g>
      </g>
    </g>
  </g>

  <!-- faint scattered dot field for texture -->
  <g fill="#8a6a2e" opacity="0.12">
    <circle cx="500" cy="150" r="2"/><circle cx="620" cy="220" r="1.6"/><circle cx="900" cy="120" r="2"/>
    <circle cx="1100" cy="300" r="1.8"/><circle cx="750" cy="500" r="2"/><circle cx="1300" cy="600" r="1.6"/>
    <circle cx="450" cy="700" r="2"/><circle cx="980" cy="750" r="1.8"/>
  </g>
</svg>
